services:
  api:
    build:
      context: ./apps/api
    container_name: anime-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://anime:${POSTGRES_PASSWORD}@postgres:5432/anime
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  orchestrator:
    build:
      context: ./apps/orchestrator
    container_name: anime-orchestrator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://anime:${POSTGRES_PASSWORD}@postgres:5432/anime
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: anime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anime
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: anime-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: anime-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data

  # === GPU Worker: Image (ComfyUI) ===
  worker-image:
    build:
      context: ./worker/image
    container_name: anime-worker-image
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      WORKER_ID: ${IMAGE_WORKER_ID:-image-01}
      WORKER_TYPE: image
      WORKER_HOSTNAME: worker-image
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-assets}
      COMFYUI_API_URL: ${COMFYUI_API_URL:-http://comfyui:8188}
      IMAGE_WIDTH: ${IMAGE_WIDTH:-1024}
      IMAGE_HEIGHT: ${IMAGE_HEIGHT:-1024}
      CFG_SCALE: ${CFG_SCALE:-7.5}
      NUM_INFERENCE_STEPS: ${NUM_INFERENCE_STEPS:-30}
      SAMPLER: ${SAMPLER:-euler_ancestral}
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - image_models:/models

  # === GPU Worker: Video (Wan) ===
  worker-video:
    build:
      context: ./worker/video
    container_name: anime-worker-video
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      WORKER_ID: ${VIDEO_WORKER_ID:-video-01}
      WORKER_TYPE: video
      WORKER_HOSTNAME: worker-video
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-assets}
      WAN_MODEL_PATH: ${WAN_MODEL_PATH:-/models/wan}
      MOTION_MODEL_PATH: ${MOTION_MODEL_PATH:-/models/motion}
      MAX_VIDEO_LENGTH: ${MAX_VIDEO_LENGTH:-300}
      VIDEO_FPS: ${VIDEO_FPS:-24}
      VIDEO_WIDTH: ${VIDEO_WIDTH:-1920}
      VIDEO_HEIGHT: ${VIDEO_HEIGHT:-1080}
      NUM_INFERENCE_STEPS: ${VIDEO_INFERENCE_STEPS:-50}
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - video_models:/models

  # === GPU Worker: Audio (F5-TTS / Whisper) ===
  worker-audio:
    build:
      context: ./worker/audio
    container_name: anime-worker-audio
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      WORKER_ID: ${AUDIO_WORKER_ID:-audio-01}
      WORKER_TYPE: audio
      WORKER_HOSTNAME: worker-audio
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-assets}
      F5_TTS_MODEL_PATH: ${F5_TTS_MODEL_PATH:-/models/f5-tts/base}
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-medium}
      SAMPLE_RATE: ${SAMPLE_RATE:-44100}
      AUDIO_FORMAT: ${AUDIO_FORMAT:-wav}
      VOICE_CLONE_ENABLED: ${VOICE_CLONE_ENABLED:-true}
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - audio_models:/models

  # === Worker: Editor (FFmpeg - CPU) ===
  worker-editor:
    build:
      context: ./worker/editor
    container_name: anime-worker-editor
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      WORKER_ID: ${EDITOR_WORKER_ID:-editor-01}
      WORKER_TYPE: editor
      WORKER_HOSTNAME: worker-editor
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-assets}
      FFMPEG_PATH: ${FFMPEG_PATH:-ffmpeg}
      FFPROBE_PATH: ${FFPROBE_PATH:-ffprobe}
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-mp4}
      OUTPUT_WIDTH: ${OUTPUT_WIDTH:-1920}
      OUTPUT_HEIGHT: ${OUTPUT_HEIGHT:-1080}
      OUTPUT_FPS: ${OUTPUT_FPS:-24}
      OUTPUT_VIDEO_BITRATE: ${OUTPUT_VIDEO_BITRATE:-10M}
      OUTPUT_AUDIO_BITRATE: ${OUTPUT_AUDIO_BITRATE:-192k}
    depends_on:
      api:
        condition: service_started
      minio:
        condition: service_started
    volumes:
      - editor_temp:/tmp

volumes:
  postgres_data:
  redis_data:
  minio_data:
  image_models:
  video_models:
  audio_models:
  editor_temp:
