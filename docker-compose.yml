services:
  api:
    build:
      context: ./apps/api
    container_name: anime-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://anime:${POSTGRES_PASSWORD}@postgres:5432/anime
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  orchestrator:
    build:
      context: ./apps/orchestrator
    container_name: anime-orchestrator
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://anime:${POSTGRES_PASSWORD}@postgres:5432/anime
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: anime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anime
      POSTGRES_USER: anime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anime -d anime"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: anime-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    container_name: anime-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_SERVER_URL: "anime_s3.weiwei92.cc"  # 添加這行
    volumes:
      - minio_data:/data

  # ========================================
  # LLM Worker (Gemini API / 本地 LLM)
  # 部署在本機，不需要 GPU
  # ========================================
  llm-worker:
    build:
      context: ./apps/worker-agent
    container_name: anime-llm-worker
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      WORKER_ID: ${LLM_WORKER_ID:-llm-01}
      WORKER_TYPE: llm
      WORKER_HOSTNAME: llm-worker
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-16384}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  minio_data:
