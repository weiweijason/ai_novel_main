<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Anime Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">AI Anime Studio</h1>

    <div class="card mb-4">
      <div class="card-header">Create Project</div>
      <div class="card-body">
        <form method="post" action="/ui/projects">
          <div class="mb-3">
            <label class="form-label">Project Name</label>
            <input class="form-control" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" name="description" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Story Prompt</label>
            <textarea class="form-control" name="source_prompt" rows="2"></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Create</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Projects</div>
      <div class="table-responsive">
        <table class="table mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {% for p in projects %}
            <tr>
              <td><code>{{ p.id }}</code></td>
              <td>{{ p.name }}</td>
              <td>{{ p.status }}</td>
              <td><a class="btn btn-sm btn-outline-primary" href="/ui/projects/{{ p.id }}">Open</a></td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-muted p-3">No projects yet.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
